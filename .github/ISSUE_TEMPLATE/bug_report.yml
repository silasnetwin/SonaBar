name: Bug report
description: Something in SineFlow does not work as expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove personal text, names and paths from logs before pasting them.
  - type: input
    id: version
    attributes:
      label: SineFlow version
      description: Settings → About, for example 0.1.3
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      placeholder: Windows 11 26100.2894
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Press Ctrl + Shift + Space
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Screenshots help, especially with the overlay or the window frame.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dictation and insertion
        - Models and downloads
        - Settings and interface
        - File transcription
        - Meetings
        - Installer or update
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics (optional)
      description: A short excerpt from %LOCALAPPDATA%\SNine Studios\SineFlow\Logs, with personal content removed.
      render: text
