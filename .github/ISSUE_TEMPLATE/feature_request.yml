name: Feature request
description: Suggest a capability or an improvement for SineFlow.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        SineFlow stays local, private and quiet. Please describe the problem before the solution.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation you are in, not only the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like SineFlow to do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dictation and insertion
        - Models and downloads
        - Settings and interface
        - File transcription
        - Meetings
        - Privacy and data
        - Other
    validations:
      required: true
  - type: checkboxes
    id: promises
    attributes:
      label: Product promises
      options:
        - label: This can work fully offline.
          required: true
        - label: This does not require an account, telemetry or a cloud service.
          required: true
