name: Release SonaBar

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # Secrets are mapped to environment variables here because the `secrets` context
      # cannot be used inside a step condition.
      WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
      WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and package
        shell: pwsh
        run: ./build.ps1 -Configuration Release -UpdateFeed https://github.com/silasnetwin/SonaBar/releases/latest/download/sonabar-update.json
      - name: Optionally sign release files
        if: ${{ env.WINDOWS_SIGNING_PFX_BASE64 != '' && env.WINDOWS_SIGNING_PASSWORD != '' }}
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'sonabar-signing.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /fd SHA256 /f $certificate /p $env:WINDOWS_SIGNING_PASSWORD /tr http://timestamp.digicert.com /td SHA256 dist\SonaBar-Setup-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Code signing failed.' }
      - name: Create release update manifest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $hash = (Get-FileHash dist\SonaBar-Setup-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Get-FileHash -LiteralPath dist\SonaBar-Portable-x64.zip,dist\SonaBar-Setup-x64.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content -LiteralPath dist\SHA256SUMS.txt
          $manifest = @(@{ Version=$version; Channel='stable'; Url="https://github.com/silasnetwin/SonaBar/releases/download/$env:RELEASE_TAG/SonaBar-Setup-x64.exe"; Sha256=$hash })
          $manifest | ConvertTo-Json -Depth 3 -AsArray | Set-Content -LiteralPath dist\sonabar-update.json -Encoding utf8
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/SonaBar-Setup-x64.exe
            dist/SonaBar-Portable-x64.zip
            dist/SHA256SUMS.txt
            dist/sonabar-update.json
