  <rect x="82" y="84" width="20" height="79" rx="10" fill="url(#markBaraccent)"/>

  <rect x="110" y="53" width="36" height="140" rx="18" fill="url(#markCoreDeep)"/>
  <g clip-path="url(#markCoreClip)">
