<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="sineflow-mark-title sineflow-mark-desc">
  <title id="sineflow-mark-title">SineFlow</title>
  <desc id="sineflow-mark-desc">Five vertical sound bars with a blue leaf sweeping through the tall centre bar, on a transparent background.</desc>
  <defs>
    <linearGradient id="markBaraccent" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#8FB9FF"/>
      <stop offset="0.45" stop-color="#5C93F0"/>
      <stop offset="1" stop-color="#2E5FA8"/>
    </linearGradient>
    <linearGradient id="markCoreDeep" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#1D2836"/>
      <stop offset="0.55" stop-color="#16202C"/>
      <stop offset="1" stop-color="#101821"/>
    </linearGradient>
    <linearGradient id="markRibbonaccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9D2FF"/>
      <stop offset="0.6" stop-color="#7FA9F7"/>
