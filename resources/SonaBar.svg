    <rect x="336" y="386" width="44" height="250" rx="22"/>
    <rect x="412" y="256" width="44" height="510" rx="22"/>
    <rect x="488" y="344" width="44" height="336" rx="22"/>
    <rect x="568" y="430" width="44" height="162" rx="22"/>
    <rect x="644" y="344" width="44" height="336" rx="22"/>
    <rect x="724" y="474" width="44" height="76" rx="22"/>
